name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias splitwise \
            -storepass SplitWiser2026! \
            -keypass SplitWiser2026! \
            -dname "CN=SplitWiser, OU=Dev, O=SplitWiser, L=Pune, ST=MH, C=IN"

          echo "=== SHA-1 FINGERPRINT ==="
          keytool -list -v -keystore release-key.jks -alias splitwise -storepass SplitWiser2026! 2>/dev/null | grep "SHA1:"
          echo "=== END ==="

          echo "=== BASE64_START ==="
          base64 release-key.jks
          echo "=== BASE64_END ==="

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: release-key-jks
          path: release-key.jks
          retention-days: 30

name: Build APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate keystore and build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: SplitWiser2026!
          ANDROID_KEY_ALIAS: splitwise
          ANDROID_KEY_PASSWORD: SplitWiser2026!
        run: |
          # Generate a persistent release keystore
          keytool -genkey -v \
            -keystore /tmp/release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias splitwise \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -dname "CN=SplitWiser, OU=Dev, O=SplitWiser, L=Pune, ST=MH, C=IN"

          echo "=== SHA-1 FINGERPRINT (add to Firebase Console) ==="
          keytool -list -v -keystore /tmp/release-key.jks -alias splitwise -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null | grep "SHA1:"
          echo "=== END ==="

          # Build APK with this keystore
          export ANDROID_KEYSTORE_PATH=/tmp/release-key.jks
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: split-wise-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
